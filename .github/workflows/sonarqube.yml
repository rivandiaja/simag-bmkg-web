name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    # Automatic Analysis is active. Enable CI only after disabling it in Cloud.
    if: github.ref == 'refs/heads/main' && vars.SONAR_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check SonarQube Cloud configuration
        shell: bash
        run: |
          missing=0
          for key in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure $key in repository Settings > Secrets and variables > Actions. See docs/testing/SONARQUBE.md."
              missing=1
            fi
          done
          exit "$missing"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without application lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run existing unit tests
        run: npm run test:unit
      - name: Analyze source and enforce Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Save scanner task metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-task-${{ github.run_number }}
          path: .scannerwork/report-task.txt
          if-no-files-found: ignore
          retention-days: 30
