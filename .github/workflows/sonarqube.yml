name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    # Enable this job after switching the Cloud project to CI-based analysis.
    if: github.ref == 'refs/heads/main' && vars.SONAR_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'rivandiaja_simag-bmkg-web' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'rivandiaja' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check SonarQube Cloud token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Configure the SONAR_TOKEN repository secret. See docs/testing/SONARQUBE.md.'
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without application lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run unit tests and generate LCOV
        run: |
          npm run test:unit:coverage
          test -s coverage/lcov.info

      - name: Analyze source and enforce Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Save scanner metadata and LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-task-${{ github.run_number }}
          path: |
            .scannerwork/report-task.txt
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 30
